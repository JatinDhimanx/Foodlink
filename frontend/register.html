<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FoodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container auth-container">
        <div class="auth-card" style="max-width: 550px;">
            <div class="auth-header">
                <h1>Create an Account</h1>
                <p>Join FoodLink and start making a difference.</p>
            </div>
            
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="role">I am joining as a:</label>
                    <select id="role" class="form-select" onchange="toggleLocationGroup()">
                        <option value="restaurant">Restaurant / Food Donor</option>
                        <option value="ngo">NGO / Food Receiver</option>
                        <option value="volunteer">Volunteer Driver</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="name">Organization/Full Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                
                <div id="location-group">
                    <hr style="border: 1px solid var(--border); margin: 1.5rem 0;">
                    <h3 class="mb-2" style="font-size: 1.1rem; color: var(--text-main);">Location Details</h3>
                    <div class="form-group">
                        <label class="form-label" for="address">Street Address</label>
                        <input type="text" id="address" class="form-control" placeholder="123 Example St, City">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Coordinates</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="lat" class="form-control" placeholder="Latitude" readonly>
                            <input type="text" id="lng" class="form-control" placeholder="Longitude" readonly>
                        </div>
                        <button id="fetch-location" class="btn btn-outline mt-1" style="width:100%">Get Current Location</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-3">Register</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html">Log In</a></p>
            </div>
        </div>
    </div>

    <script>
        function toggleLocationGroup() {
            const role = document.getElementById('role').value;
            const locationGroup = document.getElementById('location-group');
            if(role === 'volunteer') {
                locationGroup.style.display = 'none';
            } else {
                locationGroup.style.display = 'block';
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
