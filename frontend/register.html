<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner with FoodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blue: #EAF3FA;
            --brand-green: #6CBE58;
            --brand-dark: #1A1A1A;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-blue);
            color: var(--brand-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-card {
            background: var(--white);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        .auth-card h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .auth-card p {
            color: #7A8B99;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #555;
        }

        .form-control,
        .form-select {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--brand-green);
            box-shadow: 0 0 0 3px rgba(108, 190, 88, 0.1);
        }

        .location-box {
            background: var(--bg-blue);
            padding: 1.5rem;
            border-radius: 16px;
            margin-top: 1.5rem;
        }

        .btn-solid-green {
            width: 100%;
            background: var(--brand-green);
            color: var(--white);
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-solid-green:hover {
            background: #5aa647;
            transform: translateY(-2px);
        }

        .btn-outline {
            width: 100%;
            background: transparent;
            border: 2px solid var(--brand-dark);
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .auth-footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #7A8B99;
            text-align: center;
        }

        .auth-footer a {
            color: var(--brand-green);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h1>Partner with FoodLink</h1>
        <p>Join the network to distribute or deliver surplus food.</p>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label" for="role">Account Type</label>
                <select id="role" class="form-select" onchange="toggleLocationGroup()">
                    <option value="restaurant">Restaurant Partner (Donor)</option>
                    <option value="ngo">NGO Partner (Receiver)</option>
                    <option value="volunteer">Delivery Partner (Volunteer)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="name" class="form-control" placeholder="Organization/Full Name" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" class="form-control" placeholder="Phone Number" required>
                </div>
            </div>

            <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="Create Password" required>
            </div>

            <div id="location-group" class="location-box">
                <h3 style="font-size: 1rem; margin-bottom: 1rem;">Location Details</h3>
                <div class="form-group">
                    <input type="text" id="address" class="form-control" placeholder="Complete Street Address">
                </div>
                <div class="form-row" style="margin-bottom: 1rem;">
                    <input type="text" id="lat" class="form-control" placeholder="Lat" readonly
                        style="background: #f5f5f5;">
                    <input type="text" id="lng" class="form-control" placeholder="Lng" readonly
                        style="background: #f5f5f5;">
                </div>
                <button type="button" class="btn-outline">📍 Auto-fetch Location</button>
            </div>

            <button type="submit" class="btn-solid-green">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login.html">Sign In</a></p>
            <p style="margin-top: 10px;"><a href="/index.html">&larr; Back to Home</a></p>
        </div>
    </div>

    <script>
        function toggleLocationGroup() {
            const role = document.getElementById('role').value;
            document.getElementById('location-group').style.display = role === 'volunteer' ? 'none' : 'block';
        }
    </script>
</body>

</html>
