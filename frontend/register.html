<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner with FoodLink</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div id="navbar-container"></div>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 600px; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
            <div class="auth-header" style="text-align: left; margin-bottom: 2.5rem;">
                <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem;">Partner with us</h1>
                <p class="text-muted">Join the FoodLink network to distribute or deliver surplus food.</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="role" style="font-size: 0.9rem; color: var(--text-muted);">ACCOUNT
                        TYPE</label>
                    <select id="role" class="form-select" onchange="toggleLocationGroup()"
                        style="border-radius: 8px; padding: 1rem;">
                        <option value="restaurant">Restaurant Partner (Donor)</option>
                        <option value="ngo">NGO Partner (Receiver)</option>
                        <option value="volunteer">Delivery Partner (Volunteer)</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group floating">
                        <input type="text" id="name" class="form-control" placeholder=" " required>
                        <label class="form-label" for="name">Organization/Full Name</label>
                    </div>
                    <div class="form-group floating">
                        <input type="tel" id="phone" class="form-control" placeholder=" " required>
                        <label class="form-label" for="phone">Phone Number</label>
                    </div>
                </div>

                <div class="form-group floating">
                    <input type="email" id="email" class="form-control" placeholder=" " required>
                    <label class="form-label" for="email">Email Address</label>
                </div>

                <div class="form-group floating">
                    <input type="password" id="password" class="form-control" placeholder=" " required>
                    <label class="form-label" for="password">Create Password</label>
                </div>

                <div id="location-group"
                    style="background: var(--light); padding: 1.5rem; border-radius: var(--radius-md); margin-top: 1.5rem;">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem;">Location Details</h3>
                    <div class="form-group floating">
                        <input type="text" id="address" class="form-control" placeholder=" ">
                        <label class="form-label" for="address">Complete Street Address</label>
                    </div>

                    <div style="display:flex; gap:10px; margin-bottom: 1rem;">
                        <input type="text" id="lat" class="form-control" placeholder="Lat" readonly
                            style="background: #e9ecef;">
                        <input type="text" id="lng" class="form-control" placeholder="Lng" readonly
                            style="background: #e9ecef;">
                    </div>
                    <button id="fetch-location" type="button" class="btn btn-outline"
                        style="width: 100%; font-size: 0.85rem; border-color: var(--dark); color: var(--dark);">📍
                        Auto-fetch Location</button>
                </div>

                <button type="submit" class="btn btn-primary btn-block"
                    style="margin-top: 1rem; padding: 1rem; font-size: 1rem;">Create Account</button>
                    
                <div class="auth-footer">
                    <p>Already have an account? <a href="/login.html">Log In</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleLocationGroup() {
            const role = document.getElementById('role').value;
            document.getElementById('location-group').style.display = role === 'volunteer' ? 'none' : 'block';
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
