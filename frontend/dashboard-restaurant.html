<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Dashboard | FoodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1 style="color: var(--primary-dark)">Welcome, <span id="user-name">Partner</span></h1>
                <p class="text-muted">Manage your surplus food donations</p>
            </div>
            <a href="/map-view.html" class="btn btn-outline">Live Map</a>
        </div>

        <div class="dashboard-grid">
            <!-- Left Column: My Listings -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Your Food Listings</h2>
                </div>
                <div class="panel-body">
                    <div class="item-list" id="listings-container">
                        <p class="text-muted">Loading your listings...</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Add New -->
            <div class="panel h-fit">
                <div class="panel-header bg-light">
                    <h2 class="panel-title">Donate Surplus Food</h2>
                </div>
                <div class="panel-body">
                    <form id="add-food-form">
                        <div class="form-group">
                            <label class="form-label" for="foodType">Food Description</label>
                            <input type="text" id="foodType" class="form-control" placeholder="e.g. 5 boxes of pasta, fresh bread" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="quantity">Quantity (Servings/Weight)</label>
                            <input type="text" id="quantity" class="form-control" placeholder="e.g. 20 servings, 5 kg" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="pickupTime">Latest Pickup Time</label>
                            <input type="datetime-local" id="pickupTime" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">List Food for Donation</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
