<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | FoodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Exact same FoodX styling */
        :root { --bg-blue: #EAF3FA; --brand-green: #6CBE58; --brand-dark: #1A1A1A; --white: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-blue); color: var(--brand-dark); padding: 2rem; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header-section h1 { font-size: 2rem; font-weight: 700; }
        .header-section span { color: var(--brand-green); }
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .panel { background: var(--white); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); overflow: hidden; }
        .panel-header { padding: 1.5rem 2rem; border-bottom: 1px solid #eee; background: #fff; }
        .panel-body { padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-control { width: 100%; padding: 1rem; border: 1px solid #ddd; border-radius: 12px; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: var(--brand-green); }
        .btn-solid-green { width: 100%; background: var(--brand-green); color: var(--white); padding: 1rem; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .list-item { padding: 1rem; border: 1px solid #eee; border-radius: 12px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: rgba(108, 190, 88, 0.1); color: var(--brand-green); padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; }
        .logout-btn { background: #ff4d4d; color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-section">
            <div>
                <h1>Welcome, <span>Partner</span></h1>
                <p style="color: #7A8B99;">Manage your surplus food donations</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <div class="panel-header"><h2>Your Active Food Listings</h2></div>
                <div class="panel-body" id="listings-container">
                    <p style="color: #7A8B99;">Loading listings...</p>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header"><h2>Donate Surplus Food</h2></div>
                <div class="panel-body">
                    <form id="add-food-form">
                        <div class="form-group"><input type="text" id="foodType" class="form-control" placeholder="Food Description (e.g., Pasta)" required></div>
                        <div class="form-group"><input type="text" id="quantity" class="form-control" placeholder="Quantity (e.g., 20 Servings)" required></div>
                        <div class="form-group"><input type="datetime-local" id="pickupTime" class="form-control" required></div>
                        <input type="hidden" id="lat" value="28.6139">
                        <input type="hidden" id="lng" value="77.2090">
                        <button type="submit" class="btn-solid-green">List for Donation</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if(!token) window.location.href = '/login.html';

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // 1. Fetch existing listings on load (GET /api/food/my-listings)
        async function fetchMyListings() {
            try {
                const res = await fetch('/api/food/my-listings', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const container = document.getElementById('listings-container');
                container.innerHTML = ''; // clear loading text

                if(data.length === 0) {
                    container.innerHTML = '<p>No active listings found.</p>';
                    return;
                }

                data.forEach(item => {
                    container.innerHTML += `
                        <div class="list-item">
                            <div>
                                <h4 style="margin-bottom: 5px;">${item.quantity} ${item.foodType}</h4>
                                <p style="font-size: 0.85rem; color: #7A8B99;">Pick up by: ${new Date(item.pickupTime).toLocaleString()}</p>
                            </div>
                            <span class="badge">${item.status}</span>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error fetching listings:", error);
            }
        }

        // 2. Handle new food submission (POST /api/food/)
        document.getElementById('add-food-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                foodType: document.getElementById('foodType').value,
                quantity: document.getElementById('quantity').value,
                pickupTime: document.getElementById('pickupTime').value,
                location: {
                    lat: parseFloat(document.getElementById('lat').value),
                    lng: parseFloat(document.getElementById('lng').value),
                    address: "Restaurant Location" // You can add a field for this
                }
            };

            try {
                const res = await fetch('/api/food/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if(res.ok) {
                    alert('Food Listed Successfully!');
                    document.getElementById('add-food-form').reset();
                    fetchMyListings(); // Refresh the list
                } else {
                    const errorData = await res.json();
                    alert('Failed: ' + errorData.message);
                }
            } catch (error) {
                console.error("API Error:", error);
            }
        });

        // Initialize dashboard
        fetchMyListings();
    </script>
</body>
</html>
