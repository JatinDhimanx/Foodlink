<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Partner | FoodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Exact same styling as login.html */
        :root { --bg-blue: #EAF3FA; --brand-green: #6CBE58; --brand-dark: #1A1A1A; --white: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-blue); color: var(--brand-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
        
        .auth-card { background: var(--white); padding: 3rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 600px; text-align: center; }
        .auth-card h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        .auth-card p { color: #7A8B99; margin-bottom: 2.5rem; font-size: 0.95rem; }
        
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #555; text-transform: uppercase; letter-spacing: 0.5px;}
        .form-control, .form-select { width: 100%; padding: 1rem; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s; background: #fff; -webkit-appearance: none;}
        .form-control:focus, .form-select:focus { border-color: var(--brand-green); box-shadow: 0 0 0 3px rgba(108, 190, 88, 0.1); }
        
        /* Specific modern style for select box */
        .form-select { background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat, repeat; background-position: right .7em top 50%, 0 0; background-size: .65em auto; padding-right: 2.5rem;}
        
        .location-box { background: var(--bg-blue); padding: 1.5rem; border-radius: 16px; margin-top: 1rem; border: 1px dashed #ccc;}
        
        .btn-solid-green { width: 100%; background: var(--brand-green); color: var(--white); padding: 1rem; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 1.5rem; text-transform: uppercase; letter-spacing: 1px;}
        .btn-solid-green:hover { background: #5aa647; transform: translateY(-2px); }
        .btn-solid-green:disabled { background: #ccc; cursor: not-allowed; }
        
        .auth-footer { margin-top: 2.5rem; font-size: 0.9rem; color: #7A8B99; border-top: 1px solid #eee; padding-top: 1.5rem; }
        .auth-footer a { color: var(--brand-green); font-weight: 600; text-decoration: none; }
        .logo-back { font-size: 1.2rem; font-weight: 800; text-decoration: none; color: var(--brand-dark); position: absolute; top: 20px; left: 20px; }
        .logo-back span { color: var(--brand-green); }

        @media (max-width: 600px) {
            .auth-card { padding: 2rem; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>
    <a href="/" class="logo-back">🍽️ FOOD<span>LINK</span></a>
    
    <div class="auth-card">
        <h1>Join the Network</h1>
        <p>Register as a Restaurant, NGO, or Volunteer Partner.</p>
        
        <form id="register-form">
            <div class="form-group">
                <label class="form-label" for="role">Account Type (Role)</label>
                <select id="role" class="form-select" onchange="toggleLocationGroup()">
                    <option value="restaurant">Restaurant Partner (Donor)</option>
                    <option value="ngo">NGO Partner (Claimer)</option>
                    <option value="volunteer">Delivery Partner (Volunteer)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="name" class="form-control" placeholder="Organization/Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                </div>
            </div>
            
            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="Create Password" required>
            </div>
            
            <div id="location-group" class="location-box">
                <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--brand-dark);">Location Details</h3>
                <div class="form-group">
                    <input type="text" id="address" class="form-control" placeholder="Street Address (e.g. 123 Main St)">
                </div>
                <div class="form-row" style="margin-bottom: 1rem;">
                    <input type="number" id="lat" class="form-control" placeholder="Lat" step="any">
                    <input type="number" id="lng" class="form-control" placeholder="Lng" step="any">
                </div>
                <button type="button" class="form-control" style="background: var(--brand-dark); color: white; cursor: pointer;" onclick="fetchCurrentLocation()">📍 Auto-fetch Location</button>
            </div>

            <button type="submit" class="btn-solid-green" id="submit-btn">Create Account</button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="/login.html">Sign In</a></p>
        </div>
    </div>

    <script>
        // Hide address for volunteers immediately if needed, but schema requires location.
        // For simplicity, lets keep it visible but volunteers might not use it.
        function toggleLocationGroup() {
            const role = document.getElementById('role').value;
            // document.getElementById('location-group').style.display = role === 'volunteer' ? 'none' : 'block';
        }

        // Use standard browser Geolocation API
        function fetchCurrentLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }
            alert('Fetching location... please allow browser permission.');
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('lat').value = position.coords.latitude;
                    document.getElementById('lng').value = position.coords.longitude;
                    document.getElementById('address').value = "GPS Location Fetched";
                },
                (error) => {
                    alert('Unable to retrieve location: ' + error.message);
                }
            );
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            
            // Gather nested data exactly as per database-schema.md
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
                location: {
                    lat: parseFloat(document.getElementById('lat').value),
                    lng: parseFloat(document.getElementById('lng').value),
                    address: document.getElementById('address').value
                }
            };

            // Basic validation for location if not volunteer
            if(payload.role !== 'volunteer' && (isNaN(payload.location.lat) || !payload.location.address)) {
                alert('Please provide location details (address and lat/lng)');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating Account...';

            try {
                // Hitting specified endpoint: POST /api/auth/register
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if(response.ok) {
                    alert('Registration successful! Please sign in.');
                    window.location.href = '/login.html';
                } else {
                    alert('Error: ' + (data.message || 'Failed to register'));
                }
            } catch (err) {
                console.error("API Error:", err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Create Account';
            }
        });
    </script>
</body>
</html>
