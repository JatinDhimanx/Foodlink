<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Dashboard | FoodLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1 style="color: var(--primary-dark)">Welcome, <span id="user-name">Hero</span></h1>
                <p class="text-muted">Help deliver food and fight hunger</p>
            </div>
            <a href="/map-view.html" class="btn btn-outline">Check Map</a>
        </div>

        <div class="dashboard-grid">
            <!-- Left: Pending Transport Requests -->
            <div class="panel">
                <div class="panel-header" style="background-color: rgba(243, 156, 18, 0.05);">
                    <h2 class="panel-title" style="color: var(--secondary-dark)">Available Delivery Tasks</h2>
                </div>
                <div class="panel-body">
                    <div class="item-list" id="pending-deliveries">
                        <p class="text-muted">Looking for delivery tasks...</p>
                    </div>
                </div>
            </div>

            <!-- Right: My Deliveries -->
            <div class="panel h-fit">
                <div class="panel-header">
                    <h2 class="panel-title">My Active Deliveries</h2>
                </div>
                <div class="panel-body">
                    <div class="item-list" id="my-deliveries">
                        <p class="text-muted">Loading your deliveries...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
