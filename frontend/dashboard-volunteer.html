<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partner | FoodLink</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1.4rem;
            margin-bottom: 1.2rem;
            transition: all var(--transition-smooth);
        }

        .task-card:hover {
            box-shadow: var(--shadow-sm);
            border-color: var(--border);
        }

        .route-line {
            border-left: 2px solid var(--border-light);
            margin-left: 7px;
            padding-left: 20px;
            padding-bottom: 10px;
            position: relative;
        }

        .route-marker {
            position: absolute;
            left: -8px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-muted);
            top: 2px;
        }

        .route-marker.active {
            background: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .delivery-count {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .delivery-count-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .delivery-count-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <div class="container dashboard-container" style="max-width: 800px;">
        <div class="dashboard-header"
            style="background: var(--bg-card); padding: 2rem; border-radius: var(--radius-lg); margin-bottom: 2rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); border-bottom: none;">
            <div>
                <span class="status-badge status-available" style="display:inline-block; margin-bottom: 0.8rem;">🟢 ONLINE</span>
                <h1 style="color: var(--text-main); margin-bottom: 0.3rem;">Welcome, <span id="user-name">Hero</span></h1>
                <p class="text-muted">Help deliver food and fight hunger</p>
            </div>
            <div style="text-align: right;">
                <div class="delivery-count">
                    <span class="delivery-count-number">0</span>
                    <span class="delivery-count-label">Deliveries</span>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Left: Pending Transport Requests -->
            <div class="panel">
                <div class="panel-header" style="background-color: transparent; border-color: var(--border-light);">
                    <h2 class="panel-title" style="color: var(--text-main);">Available Delivery Tasks</h2>
                </div>
                <div class="panel-body" id="pending-deliveries" style="padding: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.4rem;">
                        <span style="font-weight: 600; font-size: 0.95rem; color: var(--text-main);">📦 20 Servings Pasta</span>
                        <span style="color: var(--primary); font-weight: 700; font-size: 0.9rem;">3.2 km</span>
                    </div>

                    <div class="route-line">
                        <div class="route-marker"></div>
                        <p style="font-size: 0.9rem; margin: 0; color: var(--text-main); line-height: 1.5;"><strong>Pickup:</strong> The Grand Hotel</p>
                    </div>
                    <div style="position: relative; padding-left: 20px;">
                        <div class="route-marker active"></div>
                        <p style="font-size: 0.9rem; margin: 0; color: var(--text-main); line-height: 1.5;"><strong>Drop:</strong> Hope Foundation NGO</p>
                    </div>

                    <button class="btn btn-primary btn-block" style="margin-top: 1.6rem;">Accept Delivery</button>
                </div>
            </div>

            <!-- Right: My Deliveries -->
            <div class="panel h-fit">
                <div class="panel-header">
                    <h2 class="panel-title">My Active Deliveries</h2>
                </div>
                <div class="panel-body" style="padding: 2rem;">
                    <div class="item-list" id="my-deliveries">
                        <p class="text-muted" style="text-align: center; font-size: 0.9rem;">No active deliveries</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
